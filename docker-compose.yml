services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: jeevaa-portfolio:latest
    container_name: jeevaa-portfolio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
